# Central do Pulso: API de ingestão + jobs + HTTPS automático.
# O relógio só fala HTTPS com certificado público (o Garmin Connect Mobile recusa autoassinado),
# então o Caddy pega um certificado do Let's Encrypt para PULSO_DOMAIN.
#   cp .env.example .env && editar && docker compose up -d
#   docker compose exec api pulso token create fr255             # token do relógio (envio + mostrador)
#   docker compose exec api pulso token create painel --painel   # token do painel web (só leitura)
services:
  api:
    build: ../central
    env_file: .env
    volumes: ["pulso-data:/data"]
    restart: unless-stopped
    expose: ["8080"]

  jobs:
    build: ../central
    env_file: .env
    command: ["pulso", "daemon"]
    # tokens do Garmin Connect ficam em /data/garminconnect (PULSO_GARMIN_TOKENS no Dockerfile)
    volumes: ["pulso-data:/data"]
    restart: unless-stopped

  mcp:
    # MCP por HTTP para o Claude Code/Desktop remoto (Bearer PULSO_MCP_TOKEN). Comente se usar só stdio local.
    build: ../central
    env_file: .env
    command: ["pulso", "mcp", "--http", "--host", "0.0.0.0", "--port", "8765"]
    volumes: ["pulso-data:/data"]
    restart: unless-stopped
    expose: ["8765"]

  caddy:
    image: caddy:2.10
    ports: ["80:80", "443:443"]
    environment:
      PULSO_DOMAIN: ${PULSO_DOMAIN}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    restart: unless-stopped

volumes:
  pulso-data:
  caddy-data:
