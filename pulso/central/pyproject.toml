[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pulso"
version = "0.1.0"
description = "Central de saúde e performance: ingere dados brutos do Garmin FR255, cruza com reuniões/agenda/código e explica de onde vem o estresse."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
analysis = ["scikit-learn>=1.5", "statsmodels>=0.14", "ruptures>=1.1"]
garmin = ["garminconnect>=0.2.30", "garmin-fit-sdk>=21.0"]
ai = ["anthropic>=1.0", "mcp>=1.20"]
calendar = ["icalendar>=6.0"]
bridge = ["bless>=0.3", "bleak>=1.1"]
dev = ["pytest>=8.0", "neurokit2>=0.2.10"]
all = ["pulso[analysis,garmin,ai,calendar,dev]"]

[project.scripts]
pulso = "pulso.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pulso"]

[tool.hatch.build.targets.wheel.force-include]
"pulso/store/schema.sql" = "pulso/store/schema.sql"
"pulso/painel.html" = "pulso/painel.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
